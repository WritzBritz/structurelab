[package]
name = "structurelab"
# Keep in sync with package.json (Cargo requires its own version field).
version = "0.9.1-beta"
description = "StructureLab — map art, pixel art, and model tools for Minecraft"
authors = ["StructureLab contributors"]
license = "MIT"
repository = "https://github.com/WritzBritz/structurelab"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "structurelab_lib"
# staticlib for Tauri; rlib for tests. Skip cdylib on windows-gnu
# (hits "export ordinal too large" with the Tauri dependency tree).
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
anyhow = "1"
base64 = "0.22"
fastnbt = "2"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico"] }
rayon = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
ureq = { version = "2.12", features = ["json"] }
tobj = { version = "4", default-features = false }

[features]
# Production / portable builds load the UI from the embedded frontendDist.
# Without this, the EXE opens http://localhost:5173 and fails if Vite isn't running.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
